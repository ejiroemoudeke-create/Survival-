<title>Survival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas, UI layer above it. Menus are cards on a dark asphalt ground; HUD sits in the corners. */
:root{--bg:#0e1013;--panel:#171b20;--panel2:#1f242b;--line:#2c333b;--fg:#eef0f2;--mute:#8d97a3;--accent:#ff5a1f;--accent2:#ffb02e;--good:#3ddc84;--bad:#ff3b3b;--blue:#37a0ff;
--display:'Teko','Arial Narrow',Impact,sans-serif;--body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b0d10}
#ui{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;box-sizing:border-box}
#ui>*{pointer-events:auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.screen{position:absolute;inset:0;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(14,16,19,.86),rgba(14,16,19,.96));overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.screen[hidden]{display:none!important}
.brand{font-family:var(--display);font-size:clamp(64px,16vw,120px);line-height:.85;letter-spacing:.08em;color:var(--fg);margin:0}
.brand b{color:var(--accent);font-weight:700}
.tag{color:var(--mute);letter-spacing:.18em;text-transform:uppercase;font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);padding:6px 12px;border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.gold{color:var(--accent2)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:14px 16px;text-align:left;font-family:var(--display);font-size:26px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px}
.btn small{font-family:var(--body);font-size:13px;letter-spacing:0;text-transform:none;color:var(--mute);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#14100d}
.btn.primary small{color:#3b1a0b}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn:disabled{opacity:.45}
.btn.sm{font-size:20px;padding:8px 12px;min-height:40px;display:inline-flex}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:24px}
.card p{margin:0;color:var(--mute);font-size:14px}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.lock{opacity:.5}
.stars{color:var(--accent2);letter-spacing:2px;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;font-weight:600}
.opt.on{background:var(--accent);border-color:var(--accent);color:#14100d}
.lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:6px 0 4px}
.meter{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud *{pointer-events:none}
#hud button,#hud .stick,#hud .gb{pointer-events:auto}
#hud[hidden]{display:none}
.hbar{position:absolute;left:max(0px,env(safe-area-inset-left,0px));top:8px;width:min(34vw,210px);display:flex;flex-direction:column;gap:5px}
.hbar .meter{height:12px;border:1px solid #000;background:#0008}
#hpbar{background:var(--good)}#arbar{background:var(--blue)}
#cashv{font-family:var(--display);font-size:28px;color:var(--accent2);text-shadow:0 2px 0 #000}
#top{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 0 #000;max-width:40vw}
#objective{font-family:var(--display);font-size:22px;letter-spacing:.08em;text-transform:uppercase}
#timer{font-family:var(--display);font-size:38px;line-height:1;color:var(--accent2)}
#mini{position:absolute;right:0;top:8px;width:112px;height:112px;border:2px solid #000;border-radius:50%;background:#0009}
#stars{position:absolute;right:0;top:128px;font-size:22px;letter-spacing:3px;text-shadow:0 2px 0 #000;color:var(--accent2)}
#wpn{position:absolute;right:0;bottom:calc(46vh);font-family:var(--display);font-size:22px;text-align:right;text-shadow:0 2px 0 #000}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-family:var(--display);font-size:34px;text-align:center;text-shadow:0 3px 0 #000;opacity:0;transition:opacity .25s;white-space:nowrap}
#pausebtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#000a;border:1px solid #fff4;color:#fff;font-size:16px}
.stick{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:radial-gradient(#fff1,#fff0 70%);border:2px solid #fff3;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fffa;border:2px solid #0006}
#stickL{left:6px}#stickR{right:6px;border-color:#ff5a1f66}
#btns{position:absolute;right:0;bottom:170px;width:200px;height:170px}
.gb{position:absolute;width:62px;height:62px;border-radius:50%;background:#000a;border:2px solid #fff5;color:#fff;font-family:var(--display);font-size:17px;letter-spacing:.04em;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
.gb.on{background:var(--accent);color:#14100d}
#bUse{right:0;bottom:0}#bBrake{right:72px;bottom:0}#bNitro{right:144px;bottom:0}
#bSwap{right:0;bottom:72px}#bGren{right:72px;bottom:72px}#bMine{right:144px;bottom:72px}
#bUse{background:var(--accent);color:#14100d;width:70px;height:70px}
#bRotL,#bRotR{bottom:auto;right:auto;top:auto;font-size:22px;width:54px;height:54px}
#bRotL{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:max(168px,calc(env(safe-area-inset-bottom,0px) + 168px))}
#bRotR{position:fixed;left:calc(max(8px,env(safe-area-inset-left,0px)) + 62px);bottom:max(168px,calc(env(safe-area-inset-bottom,0px) + 168px))}
#loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:5}
@media (max-height:480px){#bRotL,#bRotR{bottom:140px}.stick{width:110px;height:110px}#btns{bottom:130px}.gb{width:54px;height:54px}#mini{width:96px;height:96px}#stars{top:112px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<canvas id="game"></canvas>
<div id="ui">
 <div id="hud" hidden>
  <div class="hbar"><div class="meter"><i id="hpbar" style="width:100%"></i></div><div class="meter"><i id="arbar" style="width:0"></i></div><div id="cashv">$0</div></div>
  <div id="top"><div id="objective"></div><div id="timer"></div></div>
  <canvas id="mini" width="224" height="224"></canvas>
  <div id="stars"></div>
  <div id="wpn"></div>
  <div id="toast"></div>
  <button id="pausebtn" aria-label="Pause">II</button>
  <div class="stick" id="stickL"><i></i></div>
  <div class="stick" id="stickR"><i></i></div>
  <div id="btns">
   <button class="gb" id="bUse">ENTER</button><button class="gb" id="bBrake">BRAKE</button><button class="gb" id="bNitro">NITRO</button>
   <button class="gb" id="bRotL" aria-label="Turn view left">&#9664;</button><button class="gb" id="bRotR" aria-label="Turn view right">&#9654;</button>
   <button class="gb" id="bSwap">SWAP</button><button class="gb" id="bGren">GRENADE</button><button class="gb" id="bMine">MINE</button>
  </div>
 </div>
 <div id="screens"></div>
 <div id="loading"><h1 class="brand">SURVIV<b>AL</b></h1><div class="tag">Loading</div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* core: utilities, save data, sound, touch + keyboard input */
const G = { dt: 0, time: 0, state: 'menu', actors: [], vehicles: [], bullets: [], pickups: [], parts: [], props: [], ramps: [], colliders: [], mode: null, player: null, heat: 0, wanted: 0, shake: 0, weather: 'clear', paused: false };
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- save ---------- */
const SAVE_KEY = 'survival.save.v1';
const defaultSave = () => ({
  cash: 1500, xp: 0,
  own: { veh: ['sedan', 'bike'], wpn: ['pistol', 'smg'], hat: ['none'] },
  sel: { veh: 'sedan', wpn: 'pistol' },
  look: { skin: '#6b4429', shirt: '#1f9d3f', pants: '#4a74b0', hat: 'none', full: true, hero: true },
  stars: {}, best: {}, tasks: {}, stats: { kills: 0, wins: 0, events: 0, cash: 0, dist: 0, wrecks: 0 },
  set: { sound: true, quality: 'med', btn: 1, assist: true, zoom: 1 }
});
G.save = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const o = JSON.parse(raw); const d = defaultSave(); G.save = Object.assign(d, o); G.save.set = Object.assign(d.set, o.set || {}); G.save.stats = Object.assign(d.stats, o.stats || {}); G.save.own = Object.assign(d.own, o.own || {}); if (!G.save.look || !G.save.look.hero) G.save.look = d.look; }
  } catch (e) { /* storage unavailable: play without saving */ }
}
let saveTimer = 0;
function saveNow() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) { } }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
const levelOf = xp => Math.floor(Math.sqrt(xp / 120)) + 1;
const xpForLevel = l => (l - 1) * (l - 1) * 120;

/* ---------- sound (WebAudio synth, starts after first tap) ---------- */
const SND = { ctx: null, eng: null, engGain: null, noiseBuf: null };
function sndInit() {
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = SND.ctx = new AC();
    const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    SND.noiseBuf = b;
    SND.eng = c.createOscillator(); SND.eng.type = 'sawtooth'; SND.engGain = c.createGain(); SND.engGain.gain.value = 0;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
    SND.eng.connect(lp); lp.connect(SND.engGain); SND.engGain.connect(c.destination); SND.eng.start();
  } catch (e) { SND.ctx = null; }
}
function sfx(kind, vol = 1) {
  if (!SND.ctx || !G.save.set.sound) return;
  const c = SND.ctx, t = c.currentTime;
  const noise = (dur, freq, v, q = 0.8) => {
    const s = c.createBufferSource(); s.buffer = SND.noiseBuf; const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(v * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t, Math.random()); s.stop(t + dur);
  };
  const tone = (f0, f1, dur, v, type = 'square') => {
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(v * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur);
  };
  if (kind === 'shot') noise(0.12, 1800, 0.25);
  else if (kind === 'smg') noise(0.07, 2200, 0.18);
  else if (kind === 'shotgun') noise(0.25, 900, 0.5);
  else if (kind === 'rocket') { noise(0.4, 500, 0.35); tone(300, 80, 0.4, 0.15, 'sawtooth'); }
  else if (kind === 'boom') { noise(0.9, 160, 0.9, 0.4); tone(90, 30, 0.7, 0.5, 'sine'); }
  else if (kind === 'hit') noise(0.06, 3000, 0.12);
  else if (kind === 'crash') noise(0.2, 400, 0.4);
  else if (kind === 'pick') { tone(600, 1200, 0.12, 0.2, 'triangle'); }
  else if (kind === 'cash') { tone(900, 1500, 0.1, 0.18, 'triangle'); }
  else if (kind === 'ui') tone(500, 700, 0.05, 0.12, 'triangle');
  else if (kind === 'win') { tone(500, 1000, 0.3, 0.25, 'triangle'); }
  else if (kind === 'lose') { tone(300, 80, 0.6, 0.25, 'sawtooth'); }
  else if (kind === 'siren') tone(700, 1000, 0.5, 0.05, 'sine');
}
function engineSound(speedFrac, on) {
  if (!SND.ctx || !SND.eng) return;
  const t = SND.ctx.currentTime;
  SND.eng.frequency.setTargetAtTime(40 + speedFrac * 110, t, 0.08);
  SND.engGain.gain.setTargetAtTime(on && G.save.set.sound ? 0.05 + speedFrac * 0.06 : 0, t, 0.1);
}

/* ---------- input ---------- */
const IN = { mx: 0, mz: 0, ax: 0, az: 0, fire: false, brake: false, nitro: false, use: false, swap: false, gren: false, mine: false, aimActive: false, kx: 0, kz: 0, mouse: false };
const keys = {};
function bindInput() {
  const mkStick = (el, onMove) => {
    const knob = el.querySelector('i'); let pid = null;
    const upd = e => {
      const r = el.getBoundingClientRect(), R = r.width / 2;
      let dx = e.clientX - (r.left + R), dy = e.clientY - (r.top + R); const d = Math.hypot(dx, dy);
      if (d > R) { dx = dx / d * R; dy = dy / d * R; }
      knob.style.transform = `translate(${dx}px,${dy}px)`; onMove(dx / R, dy / R, true);
    };
    el.addEventListener('pointerdown', e => { e.preventDefault(); sndInit(); pid = e.pointerId; el.setPointerCapture(pid); upd(e); });
    el.addEventListener('pointermove', e => { if (e.pointerId === pid) upd(e); });
    const end = e => { if (e.pointerId === pid) { pid = null; knob.style.transform = ''; onMove(0, 0, false); } };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  };
  mkStick(document.getElementById('stickL'), (x, y) => { IN.mx = x; IN.mz = y; });
  mkStick(document.getElementById('stickR'), (x, y, on) => { IN.ax = x; IN.az = y; IN.fire = on && Math.hypot(x, y) > 0.25; IN.aimActive = on; });
  const btn = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener('pointerdown', e => { e.preventDefault(); sndInit(); el.setPointerCapture(e.pointerId); el.classList.add('on'); down(); });
    const u = e => { el.classList.remove('on'); if (up) up(); };
    el.addEventListener('pointerup', u); el.addEventListener('pointercancel', u);
  };
  btn('bUse', () => IN.use = true); btn('bSwap', () => IN.swap = true); btn('bGren', () => IN.gren = true); btn('bMine', () => IN.mine = true);
  btn('bRotL', () => IN.rotL = true, () => IN.rotL = false); btn('bRotR', () => IN.rotR = true, () => IN.rotR = false);
  btn('bBrake', () => IN.brake = true, () => IN.brake = false); btn('bNitro', () => IN.nitro = true, () => IN.nitro = false);
  window.addEventListener('keydown', e => {
    if (keys[e.code]) return; keys[e.code] = true; sndInit();
    if (e.code === 'KeyE') IN.use = true; if (e.code === 'KeyQ') IN.swap = true; if (e.code === 'KeyG') IN.gren = true; if (e.code === 'KeyM') IN.mine = true;
    if (e.code === 'Escape' || e.code === 'KeyP') window.dispatchEvent(new Event('survival-pause'));
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  const cv = document.getElementById('game');
  cv.addEventListener('mousemove', e => { if (e.pointerType === 'touch') return; IN.mouse = true; IN.ax = (e.clientX / innerWidth - 0.5) * 2; IN.az = (e.clientY / innerHeight - 0.55) * 2; });
  cv.addEventListener('mousedown', e => { sndInit(); IN.mfire = true; }); window.addEventListener('mouseup', () => IN.mfire = false);
}
/* merges touch + keyboard into the per-frame control state */
function readControls() {
  let kx = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  let kz = (keys.KeyS || keys.ArrowDown ? 1 : 0) - (keys.KeyW || keys.ArrowUp ? 1 : 0);
  const kl = Math.hypot(kx, kz) || 1;
  const c = { mx: IN.mx, mz: IN.mz, ax: IN.ax, az: IN.az, fire: IN.fire || !!IN.mfire || !!keys.Space, brake: IN.brake || !!keys.ShiftLeft && false || !!keys.KeyB, nitro: IN.nitro || !!keys.ShiftLeft, aim: IN.aimActive || IN.mouse };
  if (kx || kz) { c.mx = kx / kl; c.mz = kz / kl; }
  return c;
}
function consumeEdge(name) { const v = IN[name]; IN[name] = false; return v; }

'use strict';
/* world: city generation, colliders, props, ramps, weather */
const CITIES = {
  steel: { name: 'Steel Quarter', ground: 0x3d4147, road: 0x23262b, sky: 0x8aa3bd, fog: 0x8aa3bd, bcol: [0x7d8896, 0x5d6b7c, 0x8c94a0, 0x4d5866, 0xa0a7b2], h: [14, 38], fill: 0.95, trees: 0.2, N: 6, win: true },
  dust: { name: 'Dustbowl', ground: 0xc9a468, road: 0x6a5d4c, sky: 0xe6c999, fog: 0xe3c797, bcol: [0xd9b57c, 0xb98a5a, 0xcfa06a, 0xa87a50], h: [4, 9], fill: 0.55, trees: 0.0, cactus: 0.9, N: 6 },
  green: { name: 'Greenfield', ground: 0x5f9a4a, road: 0x7c6c52, sky: 0x9ccbea, fog: 0xb7d8ec, bcol: [0xb5483a, 0xe0d2b4, 0x8a6f52, 0xcfd6dc], h: [4, 8], fill: 0.5, trees: 1.0, N: 6 }
};
const CELL = 64, ROAD = 16;
const W = { group: null, N: 6, half: 192, nodes: [], cfg: null, rain: null, miniBase: null };
G.W = W;

function mkBox(w, h, d, col, x, y, z, parent, emissive) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col, emissive: emissive || 0x000000 }));
  m.position.set(x, y, z); if (parent) parent.add(m); return m;
}
function canvasTex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t; }

function buildCity(key) {
  const cfg = CITIES[key]; W.cfg = cfg; W.key = key;
  if (W.group) { G.scene.remove(W.group); W.group.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (o.material.map) && o.material.map.dispose(); o.material.dispose(); } }); }
  const grp = W.group = new THREE.Group(); G.scene.add(grp);
  G.colliders = []; G.props = []; G.ramps = []; W.nodes = [];
  const N = W.N = cfg.N, half = W.half = N * CELL / 2;
  G.scene.background = new THREE.Color(cfg.sky); G.scene.fog = new THREE.FogExp2(cfg.fog, 0.0048);
  // ground

      tleft -= dt; const inside = [G.player, ...bots].filter(a => !a.dead && Math.hypot((a.veh || a).x - zone.x, (a.veh || a).z - zone.z) < zone.r);
      owner = inside.length === 1 ? inside[0] : null; ring.material.color.setHex(inside.length > 1 ? 0xe63946 : owner ? (owner === G.player ? 0x3ddc84 : 0xffb02e) : 0xffffff);
      if (owner) { pts[owner.team] += dt; }

      if (G.player.dead) { if (S.respawnT <= 0) { S.respawnT = 2.5; S.deaths++; } S.respawnT -= dt; if (S.respawnT <= 0) respawnPlayerOnFoot(); }
      if (pts[1] >= goal) return finishGame(true, 'You held the hill'); for (const b of bots) if (pts[b.team] >= goal) return finishGame(false, b.name + ' held the hill');
      if (tleft <= 0) { const top = Math.max(...bots.map(b => pts[b.team])); finishGame(pts[1] > top, 'Time up'); }
    },
    hud() { const top = Math.max(0, ...bots.map(b => pts[b.team])); return { obj: 'Hill ' + Math.floor(pts[1]) + ' / ' + goal + 's   Best rival ' + Math.floor(top) + 's', timer: tleft, sub: owner === G.player ? 'You hold the hill' : owner ? owner.name + ' holds it' : '' }; },
    blips() { return [{ x: zone.x, z: zone.z, c: '#ffb02e', ring: zone.r }]; },
    rate() { return 1 + (tleft > 100 ? 1 : 0) + (killsOf(G.player) >= 5 ? 1 : 0); }, score() { return pts[1] * 10 + Math.max(0, tleft) }
  };
};

/* ----- tasks: hourly / daily / weekly, regenerated when their time bucket changes ----- */
const TASK_POOL = [
  { stat: 'kills', text: n => 'Get ' + n + ' kills', t: [8, 25, 90] },
  { stat: 'wrecks', text: n => 'Destroy ' + n + ' vehicles', t: [2, 6, 20] },
  { stat: 'events', text: n => 'Finish ' + n + ' events', t: [1, 3, 10] },
  { stat: 'wins', text: n => 'Win ' + n + ' events', t: [1, 2, 6] },
  { stat: 'cash', text: n => 'Collect ' + fmt(n) + ' on the street', t: [300, 1200, 6000] },
  { stat: 'dist', text: n => 'Drive ' + n + ' metres', t: [1000, 4000, 20000] }
];
const TIERS = [{ id: 'hourly', ms: 3600e3, label: 'Hourly', reward: 200, ti: 0 }, { id: 'daily', ms: 86400e3, label: 'Daily', reward: 700, ti: 1 }, { id: 'weekly', ms: 604800e3, label: 'Weekly', reward: 3000, ti: 2 }];
function refreshTasks() {
  const now = Date.now(); let changed = false;
  for (const tr of TIERS) {
    const bucket = Math.floor(now / tr.ms), cur = G.save.tasks[tr.id];
    if (!cur || cur.bucket !== bucket) {
      const picks = TASK_POOL.slice().sort(() => Math.random() - 0.5).slice(0, 3);
      G.save.tasks[tr.id] = { bucket, list: picks.map(p => ({ stat: p.stat, target: p.t[tr.ti], base: G.save.stats[p.stat] || 0, claimed: false })) }; changed = true;
    }
  }
  if (changed) saveSoon();
}
function taskProgress(t) { return Math.min(t.target, Math.floor((G.save.stats[t.stat] || 0) - t.base)); }
function claimTask(tierId, idx) {
  const tr = TIERS.find(t => t.id === tierId), t = G.save.tasks[tierId].list[idx];
  if (t.claimed || taskProgress(t) < t.target) return false; t.claimed = true; G.save.cash += tr.reward; G.save.xp += tr.reward / 4; saveNow(); return true;
}
function timeToReset(tr) { const left = tr.ms - (Date.now() % tr.ms); const m = Math.floor(left / 60000); return m >= 1440 ? Math.floor(m / 1440) + 'd ' + Math.floor((m % 1440) / 60) + 'h' : m >= 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m + 'm'; }
